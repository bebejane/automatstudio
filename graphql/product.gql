query AllProducts {
	products: allProducts {
		...ProductFragment
	}
	pagination: _allProductsMeta {
		count
	}
}

query AllProductsByClient($id: ItemId) {
	products: allProducts(filter: { client: { eq: $id } }) {
		...ProductFragment
	}
	pagination: _allProductsMeta(filter: { client: { eq: $id } }) {
		count
	}
}

query Product($productId: String) {
	product(filter: { productId: { eq: $productId } }) {
		...ProductFragment
	}
}

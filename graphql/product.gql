query AllProducts($first: IntType = 10, $skip: IntType = 0) {
	products: allProducts(first: $first, skip: $skip) {
		...ProductLightFragment
	}
	pagination: _allProductsMeta {
		count
	}
}

query AllProductsByClient($id: ItemId, $first: IntType = 10, $skip: IntType = 0) {
	products: allProducts(
		first: $first
		skip: $skip
		orderBy: date_DESC
		filter: {
			AND: [{ client: { eq: $id } }, { png: { exists: true } }, { tiff: { exists: true } }]
		}
	) {
		...ProductLightFragment
	}
	pagination: _allProductsMeta(
		filter: {
			AND: [{ client: { eq: $id } }, { png: { exists: true } }, { tiff: { exists: true } }]
		}
	) {
		count
	}
}

query AllProductsByClientByDate(
	$id: ItemId
	$dateFrom: DateTime
	$dateTo: DateTime
	$first: IntType = 10
	$skip: IntType = 0
) {
	products: allProducts(
		first: $first
		skip: $skip
		filter: {
			AND: [
				{ client: { eq: $id } }
				{ date: { gte: $dateFrom } }
				{ date: { lte: $dateTo } }
				{ png: { exists: true } }
				{ tiff: { exists: true } }
			]
		}
	) {
		...ProductLightFragment
	}
	pagination: _allProductsMeta(
		filter: {
			AND: [
				{ client: { eq: $id } }
				{ date: { gte: $dateFrom } }
				{ date: { lte: $dateTo } }
				{ png: { exists: true } }
				{ tiff: { exists: true } }
			]
		}
	) {
		count
	}
}

query Product(
	$productId: String
	$white: String = "#FFFFFF"
	$black: String = "#000000"
	$gray: String = "#BDBDBD"
) {
	product(
		filter: {
			AND: [
				{ productId: { eq: $productId } }
				{ png: { exists: true } }
				{ tiff: { exists: true } }
			]
		}
	) {
		_createdAt
		id
		productId
		png {
			...ImageFragment
		}
		tiff {
			...ImageFragment
		}
		back {
			...ImageFragment
		}
		isquareblack: png {
			...ImageBaseFragment
			responsiveImage(
				imgixParams: { w: 1080, h: 1080, fit: fill, fill: solid, fm: png32, bg: $black, pad: 160 }
			) {
				...ResponsiveImageFragment
			}
		}
		isquarewhite: png {
			...ImageBaseFragment
			responsiveImage(
				imgixParams: { w: 1080, h: 1080, fit: fill, fill: solid, fm: png32, bg: $white, pad: 160 }
			) {
				...ResponsiveImageFragment
			}
		}
		isquaregray: png {
			...ImageBaseFragment
			responsiveImage(
				imgixParams: { w: 1080, h: 1080, fit: fill, fill: solid, fm: png32, bg: $gray, pad: 160 }
			) {
				...ResponsiveImageFragment
			}
		}
		istoryblack: png {
			...ImageBaseFragment
			responsiveImage(
				imgixParams: { w: 1080, h: 1920, fit: fill, fill: solid, fm: png32, bg: $black, pad: 160 }
			) {
				...ResponsiveImageFragment
			}
		}
		istorywhite: png {
			...ImageBaseFragment
			responsiveImage(
				imgixParams: { w: 1080, h: 1920, fit: fill, fill: solid, fm: png32, bg: $white, pad: 160 }
			) {
				...ResponsiveImageFragment
			}
		}
		istorygray: png {
			...ImageBaseFragment
			responsiveImage(
				imgixParams: { w: 1080, h: 1920, fit: fill, fill: solid, fm: png32, bg: $gray, pad: 160 }
			) {
				...ResponsiveImageFragment
			}
		}
		tags {
			... on TagRecord {
				_createdAt
				id
				tag
			}
		}
		client {
			...ClientLightFragment
		}
	}
}

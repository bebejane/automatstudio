query AllProducts {
	products: allProducts {
		...ProductFragment
	}
	pagination: _allProductsMeta {
		count
	}
}

query AllProductsByClient($id: ItemId) {
	products: allProducts(
		filter: {
			AND: [{ client: { eq: $id } }, { png: { exists: true } }, { tiff: { exists: true } }]
		}
	) {
		...ProductFragment
	}
	pagination: _allProductsMeta(
		filter: {
			AND: [{ client: { eq: $id } }, { png: { exists: true } }, { tiff: { exists: true } }]
		}
	) {
		count
	}
}

query Product($productId: String) {
	product(
		filter: {
			AND: [
				{ productId: { eq: $productId } }
				{ png: { exists: true } }
				{ tiff: { exists: true } }
			]
		}
	) {
		...ProductFragment
	}
}

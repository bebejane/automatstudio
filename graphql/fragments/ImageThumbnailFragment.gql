fragment ImageThumbnailFragment on FileField {
	alt
	basename
	format
	height
	id
	mimeType
	size
	title
	url
	width
	responsiveImage(imgixParams: { w: 600, maxH: 1200, fit: fill, q: 80, auto: format }) {
		alt
		aspectRatio
		base64
		height
		sizes
		src
		srcSet
		webpSrcSet
		title
		width
	}
}

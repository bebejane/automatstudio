fragment ProductFragment on ProductRecord {
	_createdAt
	id
	productId
	png {
		...ImageFragment
	}
	tiff {
		...ImageFragment
	}
	back {
		...ImageFragment
	}
	isquareblack: png {
		...ImageBaseFragment
		responsiveImage(
			imgixParams: { w: 1080, h: 1080, fit: fill, fill: solid, fm: png32, bg: "#000000", pad: 160 }
		) {
			...ResponsiveImageFragment
		}
	}
	isquarewhite: png {
		...ImageBaseFragment
		responsiveImage(
			imgixParams: { w: 1080, h: 1080, fit: fill, fill: solid, fm: png32, bg: "#FFFFFF", pad: 160 }
		) {
			...ResponsiveImageFragment
		}
	}
	isquaregray: png {
		...ImageBaseFragment
		responsiveImage(
			imgixParams: { w: 1080, h: 1080, fit: fill, fill: solid, fm: png32, bg: "#BDBDBD", pad: 160 }
		) {
			...ResponsiveImageFragment
		}
	}
	istoryblack: png {
		...ImageBaseFragment
		responsiveImage(
			imgixParams: { w: 1080, h: 1920, fit: fill, fill: solid, fm: png32, bg: "#000000", pad: 160 }
		) {
			...ResponsiveImageFragment
		}
	}
	istorywhite: png {
		...ImageBaseFragment
		responsiveImage(
			imgixParams: { w: 1080, h: 1920, fit: fill, fill: solid, fm: png32, bg: "#FFFFFF", pad: 160 }
		) {
			...ResponsiveImageFragment
		}
	}
	istorygray: png {
		...ImageBaseFragment
		responsiveImage(
			imgixParams: { w: 1080, h: 1920, fit: fill, fill: solid, fm: png32, bg: "#BDBDBD", pad: 160 }
		) {
			...ResponsiveImageFragment
		}
	}
	tags {
		... on TagRecord {
			_createdAt
			id
			tag
		}
	}
	client {
		...ClientLightFragment
	}
}

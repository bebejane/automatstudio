fragment ProductFragment on ProductRecord {
	_createdAt
	id
	png {
		...ImageFragment
	}
	instagramStory: png {
		...ImageInstagramStoryFragment
	}
	instagramSquare: png {
		...ImageInstagramSquareFragment
	}
	productId
	tags {
		... on TagRecord {
			id
			tag
		}
	}
	client {
		...ClientLightFragment
	}
}

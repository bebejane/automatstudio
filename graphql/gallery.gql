query Gallery {
	gallery {
		id
		content {
			... on MediaBlockRecord {
				...MediaBlock
			}
			... on MediasBlockRecord {
				...MediasBlock
			}
			... on TextBlockRecord {
				...TextBlock
			}
			... on VideoBlockRecord {
				...VideoBlock
			}
		}
	}
}

fragment TextBlock on TextBlockRecord {
	id
	text(markdown: false)
	margin
	end
}

fragment MediaBlock on MediaBlockRecord {
	id
	media {
		...MediaFragment
	}
	margin
	end
}

fragment MediasBlock on MediasBlockRecord {
	id
	medias {
		...MediaBlock
	}
}

fragment VideoBlock on VideoBlockRecord {
	id
	video {
		...VideoFragment
	}
}

query Gallery {
	gallery {
		id
		content {
			... on ImageBlockRecord {
				...ImageBlock
			}
			... on ImagesBlockRecord {
				...ImagesBlock
			}
			... on TextBlockRecord {
				...TextBlock
			}
			... on VideoBlockRecord {
				...VideoBlock
			}
		}
	}
}

fragment TextBlock on TextBlockRecord {
	id
	text(markdown: false)
	margin
	end
}

fragment ImageBlock on ImageBlockRecord {
	id
	image {
		...ImageFragment
	}
	margin
	end
}

fragment ImagesBlock on ImagesBlockRecord {
	id
	images {
		...ImageBlock
	}
}

fragment VideoBlock on VideoBlockRecord {
	id
	video {
		...VideoFragment
	}
}

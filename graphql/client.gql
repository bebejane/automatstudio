query AllClients($first: IntType = 10, $skip: IntType = 0) {
	clients: allClients(first: $first, skip: $skip, orderBy: name_ASC) {
		...ClientLightFragment
	}
	pagination: _allClientsMeta {
		count
	}
}

query Client($clientId: String) {
	client(filter: { clientId: { eq: $clientId } }) {
		...ClientFragment
	}
}

query AllClientTags($id: ItemId, $first: IntType = 10, $skip: IntType = 0) {
	tags: allTags(first: $first, skip: $skip, filter: { client: { eq: $id } }) {
		id
		tag
	}
	pagination: _allClientsMeta {
		count
	}
}

query AllClients {
	clients: allClients {
		...ClientLightFragment
	}
	pagination: _allClientsMeta {
		count
	}
}

query Client($clientId: String) {
	client(filter: { clientId: { eq: $clientId } }) {
		...ClientFragment
	}
}

query AllClientTags($id: ItemId) {
	tags: allTags(filter: { client: { eq: $id } }) {
		id
		tag
	}
	pagination: _allClientsMeta {
		count
	}
}
